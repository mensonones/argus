name: CI

on:
  push:
    branches: [main]
    # Repository-level docs only. Do not ignore every *.md: the agents,
    # skills and commands under plugins/ are Markdown but are tested.
    paths-ignore:
      - README.md
      - CHANGELOG.md
      - ROADMAP.md
      - LICENSE
      - argus-definicao.md
      - eval/**/*.md
  pull_request:
    paths-ignore:
      - README.md
      - CHANGELOG.md
      - ROADMAP.md
      - LICENSE
      - argus-definicao.md
      - eval/**/*.md

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: plugins/argus
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: plugins/argus/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - name: Committed dist/ matches the TypeScript sources
        if: matrix.os == 'ubuntu-latest'
        run: git diff --exit-code -- dist
      - name: Packed install handshake
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/release-validation.mjs
