name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: plugins/argus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: plugins/argus/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - name: Committed dist/ matches the TypeScript sources
        if: matrix.os == 'ubuntu-latest'
        run: git diff --exit-code -- dist
      - name: Packed install handshake
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/release-validation.mjs
